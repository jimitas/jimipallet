      じみパレ<span style="font-size: 8px">(地味に助かる算数パレット)</span>
    </div>

    <label style="width:180px">
      <img id="note" src="./image/note.png" />
      <input id="note_range" type="range" class="custom-range" style="width: 100px" value="2" min="0" max="3" style="cursor: pointer" />
      <input id="masu_check" type="checkbox" class="checkbox" checked/>
    </label>
    <!-- grid -->
    <label style="width:80px">
      <img id="grid" src="./image/grid.png" />
      <input type="checkbox" id="grid_check" class="checkbox" checked />
    </label>
    <!-- figure -->
    <select id="figure_box" class="form-select" name="figure">
      <option value="1" style="color: #333">📐</option>
      <option value="1" style="color: #333">--</option>
      <option value="2" style="color: #333">□</option>
      <option value="3" style="color: #333">△</option>
      <option value="4" style="color: #333">◣</option>
      <option value="5" style="color: #333">◢</option>
      <option value="6" style="color: #333">◀</option>
      <option value="7" style="color: #333">◁</option>
      <option value="8" style="color: #333">◇</option>
      <option value="9" style="color: #333">◆</option>
      <option value="10" style="color: #333">○</option>
